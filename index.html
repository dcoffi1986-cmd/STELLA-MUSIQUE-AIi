 const list=document.createElement("div");content.append(node("h2","Inscriptions préparées"),list);
 async function refresh(){const {data,error}=await client.from("invitations_choristes").select("id,nom,identifiant,pupitre,statut").eq("chorale_id",chorale.id).order("cree_le",{ascending:false});list.replaceChildren();if(error){list.append(node("p","Chargement impossible : "+error.message));return}if(!data?.length){list.append(node("p","Aucune inscription préparée."));return}for(const row of data){const box=document.createElement("p");box.append(node("strong",row.nom),node("span"," — "+row.identifiant+" — "+(row.pupitre||"Pupitre non précisé")+" — "+row.statut));if(row.statut==="en_attente"){const activate=node("button","Activer le compte");activate.type="button";activate.onclick=async()=>{const pwd=prompt("Mot de passe provisoire du choriste (10 caractères minimum) :");if(pwd===null)return;if(pwd.length<10){alert("Utilisez au moins 10 caractères.");return}activate.disabled=true;const {data,error}=await client.functions.invoke("activer-choriste",{body:{invitation_id:row.id,password:pwd}});if(error||data?.error){let detail=data?.error||error?.message||"Erreur";if(error?.context?.json){try{const body=await error.context.json();detail=body?.error||detail;if(body?.code)detail+=" ("+body.code+")"}catch(_){}}alert("Activation impossible : "+detail);activate.disabled=false;return}alert("Compte activé. Transmettez l’identifiant et le mot de passe provisoire au choriste de manière privée.");await refresh()};box.append(document.createElement("br"),activate)}if(row.statut==="active"){
 const reset=node("button","🔐 Réinitialiser le mot de passe");reset.type="button";
 reset.onclick=()=>{

 const label=node("label","Nouveau mot de passe provisoire (10 caractères minimum)"),pwd=document.createElement("input");pwd.type="password";pwd.required=true;pwd.minLength=10;pwd.maxLength=128;pwd.autocomplete="new-password";

 const eye=node("button","👁 Afficher les mots de passe");eye.type="button";eye.onclick=()=>{const visible=pwd.type==="password";pwd.type=confirmation.type=visible?"text":"password";eye.textContent=visible?"🙈 Masquer les mots de passe":"👁 Afficher les mots de passe"};

 const msg=node("p","");msg.setAttribute("role","status");panel.append(label,pwd,confirmLabel,confirmation,eye,save,cancel,msg);box.append(document.createElement("br"),panel);
 panel.onsubmit=async e=>{e.preventDefault();if(pwd.value!==confirmation.value){msg.textContent="Les mots de passe ne correspondent pas.";return}
 if(!confirm("Réinitialiser le mot de passe de "+row.identifiant+" ? Son ancien mot de passe cessera de fonctionner."))return;
 save.disabled=true;msg.textContent="Réinitialisation en cours…";
 const {data,error}=await client.functions.invoke("reinitialiser-choriste",{body:{invitation_id:row.id,password:pwd.value}});
 if(error||data?.error){let detail=data?.error||error?.message||"Erreur";if(error?.context?.json){try{const body=await error.context.json();detail=body?.error||detail}catch(_){}}msg.textContent="Échec : "+detail;save.disabled=false;return}
 pwd.value="";confirmation.value="";msg.textContent="Mot de passe réinitialisé. Transmettez-le au choriste en privé. Il pourra le changer dans Profil.";save.disabled=false;
 };
 };box.append(document.createElement("br"),reset)
 }list.append(box)}}
 form.onsubmit=async e=>{e.preventDefault();if(!form.reportValidity())return;submit.disabled=true;status.textContent="Enregistrement…";const {error}=await client.from("invitations_choristes").insert({chorale_id:chorale.id,nom:nom.value.trim(),identifiant:identifiant.value.trim(),pupitre:pupitre.value||null,telephone:telephone.value.trim()||null,cree_par:currentUser.id});status.textContent=error?"Erreur : "+(error.code==="23505"?"Identifiant déjà utilisé. Choisissez-en un autre.":error.message):"Fiche enregistrée. Vous pouvez activer le compte.";if(!error){form.reset();await refresh()}submit.disabled=false};

function profile(){
 content.append(node("h2","Mon profil"));
 if(!ready){content.append(node("p","L'inscription sera activée après la configuration de Supabase."),node("p","La page est prête. Aucun mot de passe n'est collecté tant que la connexion n'est pas configurée."));return}
 if(currentUser){

 const status=node("p","Chargement du profil…");status.setAttribute("role","status");
 const form=document.createElement("form");
 const nameLabel=node("label","Nom affiché");const name=document.createElement("input");name.required=true;name.maxLength=100;
 const phoneLabel=node("label","Téléphone (facultatif)");const phone=document.createElement("input");phone.type="tel";phone.maxLength=30;
 const save=node("button","Enregistrer mon profil");save.type="submit";
 form.append(nameLabel,name,phoneLabel,phone,save,status);content.append(form);
 client.from("profils").select("nom,telephone").eq("id",currentUser.id).maybeSingle().then(({data,error})=>{
 if(error){status.textContent="Chargement impossible : "+error.message;return}

 });
 form.onsubmit=async e=>{e.preventDefault();save.disabled=true;status.textContent="Enregistrement…";
 const {error}=await client.from("profils").upsert({id:currentUser.id,nom:name.value.trim(),telephone:phone.value.trim()},{onConflict:"id"});
 status.textContent=error?"Erreur : "+error.message:"Profil enregistré.";save.disabled=false;
 };
 const pwdForm=document.createElement("form");pwdForm.append(node("h2","Changer mon mot de passe"));
const pwdLabel=node("label","Nouveau mot de passe (10 caractères minimum)"),pwdInput=document.createElement("input");pwdInput.type="password";pwdInput.required=true;pwdInput.minLength=10;pwdInput.maxLength=128;pwdInput.autocomplete="new-password";
const confirmLabel=node("label","Confirmer le nouveau mot de passe"),confirmInput=document.createElement("input");confirmInput.type="password";confirmInput.required=true;confirmInput.minLength=10;confirmInput.autocomplete="new-password";
function addEye(field){const wrap=document.createElement("div");wrap.style.cssText="display:flex;align-items:center;background:#fff;border-radius:12px;margin:7px 0 14px;overflow:hidden";field.style.cssText="flex:1;min-width:0;margin:0;border:0;border-radius:0";const eye=document.createElement("button");eye.type="button";eye.textContent="👁";eye.setAttribute("aria-label","Afficher le mot de passe");eye.setAttribute("aria-pressed","false");eye.style.cssText="width:60px;min-width:60px;margin:0;padding:12px;background:#fff;color:#142946;border:0;font-size:24px";eye.onclick=()=>{const visible=field.type==="password";field.type=visible?"text":"password";eye.textContent=visible?"🙈":"👁";eye.setAttribute("aria-label",visible?"Masquer le mot de passe":"Afficher le mot de passe");eye.setAttribute("aria-pressed",String(visible))};wrap.append(field,eye);return wrap}
const change=node("button","Modifier mon mot de passe");change.type="submit";const pwdStatus=node("p","");pwdStatus.setAttribute("role","status");pwdForm.append(pwdLabel,addEye(pwdInput),confirmLabel,addEye(confirmInput),change,pwdStatus);content.append(pwdForm);
pwdForm.onsubmit=async e=>{e.preventDefault();if(pwdInput.value!==confirmInput.value){pwdStatus.textContent="Les deux mots de passe sont différents.";return}change.disabled=true;pwdStatus.textContent="Modification…";const {error}=await client.auth.updateUser({password:pwdInput.value});pwdStatus.textContent=error?"Modification impossible : "+error.message:"Mot de passe modifié.";if(!error)pwdForm.reset();change.disabled=false};

 }
 const form=document.createElement("form");
 const labelEmail=node("label","Adresse e-mail ou identifiant de choriste");labelEmail.htmlFor="email";
 const email=document.createElement("input");email.id="email";email.type="text";email.autocomplete="username";email.required=true;
 const labelPassword=node("label","Mot de passe (6 caractères minimum)");labelPassword.htmlFor="password";
 const password=document.createElement("input");password.id="password";password.type="password";password.minLength=6;password.required=true;password.autocomplete="new-password";
 const buttons=document.createElement("div");buttons.className="row";
 const signup=node("button","S'inscrire");signup.type="button";
 const login=node("button","Se connecter");login.type="submit";
 const eye=node("button","👁 Afficher le mot de passe");eye.type="button";eye.onclick=()=>{const visible=password.type==="password";password.type=visible?"text":"password";eye.textContent=visible?"🙈 Masquer le mot de passe":"👁 Afficher le mot de passe"};buttons.append(signup,login);
 const message=node("p","");message.id="message";message.setAttribute("role","status");
 form.append(labelEmail,email,labelPassword,password,eye,buttons,message);
 async function submit(kind){if(!form.reportValidity())return;signup.disabled=login.disabled=true;message.textContent="Veuillez patienter…";try{
 const loginName=email.value.trim().toLowerCase();if(kind==="signup"&&!loginName.includes("@"))throw Error("Pour une inscription personnelle, une adresse e-mail est nécessaire. Les choristes sans e-mail sont inscrits par leur responsable.");const credentials={email:loginName.includes("@")?loginName:loginName+"@choristes.invalid",password:password.value};
 const {data,error}=kind==="signup"?await client.auth.signUp(credentials):await client.auth.signInWithPassword(credentials);
 if(error)throw error;
 password.value="";
 if(data.session){currentUser=data.user;show("profil")}else message.textContent="Inscription reçue. Vérifiez votre e-mail si une confirmation est demandée.";
 }catch(e){message.textContent="Opération impossible : "+(e.message||"Erreur inconnue")}finally{signup.disabled=login.disabled=false}}
 signup.onclick=()=>submit("signup");form.onsubmit=e=>{e.preventDefault();submit("login")};
 content.append(form);
}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>show(b.dataset.page)));
if(client){client.auth.getUser().then(({data})=>{currentUser=data.user;show("accueil")}).catch(()=>show("accueil"));client.auth.onAuthStateChange((_event,session)=>{currentUser=session?.user||null})}
show("accueil");

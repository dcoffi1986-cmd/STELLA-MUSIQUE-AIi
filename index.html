<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STELLA MUSIC AI</title><style>body{margin:0;background:#09172d;color:#fff;font:16px system-ui}header{background:#112544;padding:28px 20px;text-align:center;border-bottom:2px solid #d5a943}h1{color:#f1c76c;margin:0}p{line-height:1.5}.wrap{padding:20px;max-width:650px;margin:auto}.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}button{background:#173458;color:#fff;border:1px solid #d5a943;border-radius:14px;padding:16px;font-size:16px}button:focus{background:#ad8538;color:#081428}.card{background:#142946;border-radius:16px;padding:20px;margin-top:20px}h2{color:#f1c76c}input{box-sizing:border-box;width:100%;padding:14px;border-radius:10px;font-size:17px}small{color:#cbd5e1}</style></head><body><header><h1>♫ STELLA MUSIC AI</h1><p>La musique nous unit, l'intelligence nous accompagne.</p></header><div class="wrap"><div class="tabs"><button onclick="show('accueil')">🏠 Accueil</button><button onclick="show('discussions')">💬 Discussions</button><button onclick="show('chorales')">👥 Chorales</button><button onclick="show('bibliotheque')">📚 Bibliothèque</button><button onclick="show('studio')">🎼 Studio IA</button><button onclick="show('profil')">👤 Profil</button></div><section id="content" class="card"></section><p><small>Prototype de démonstration : aucune connexion, messagerie ou génération musicale active.</small></p></div><script>const pages={accueil:['Bienvenue','Découvrez les espaces de votre future application musicale.'],discussions:['Discussions','La messagerie entre choristes sera disponible dans une prochaine version.'],chorales:['Mes chorales','Créez bientôt des groupes privés pour vos répétitions et partitions.'],bibliotheque:['Bibliothèque musicale','<input placeholder="Rechercher un chant (démonstration)" aria-label="Rechercher un chant"><p>Les chants seront ajoutés après la connexion à la base de données.</p>'],studio:['Studio musical IA','La composition de chants et de psaumes sera intégrée progressivement.'],profil:['Mon profil','Connexion par numéro de téléphone prévue pour la prochaine étape.']};function show(k){let p=pages[k];document.getElementById('content').innerHTML='<h2>'+p[0]+'</h2><p>'+p[1]+'</p>'}show('accueil')</script></body></html>

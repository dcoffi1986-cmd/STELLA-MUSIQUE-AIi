<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STELLA V2.1 – Koumassi</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font:15px Arial;background:#f2f6f9;color:#163047}header{background:#064365;color:#fff;padding:13px 15px}h1{font-size:20px;margin:0}.p{background:#fff;padding:12px;display:grid;gap:8px}.r{display:flex;gap:7px;flex-wrap:wrap}input,select{min-width:0;flex:1;padding:11px;border:1px solid #cbd7df;border-radius:7px;font-size:15px}button,a.b{background:#087bad;border:0;color:#fff;padding:11px;border-radius:7px;font-weight:bold;text-decoration:none}button.a{background:#456777}#map{height:48dvh;min-height:300px}.s{background:#e8f4fb;padding:11px 13px;line-height:1.5}.f{padding:10px 13px;font-size:12px;color:#516575}#route{display:none;text-align:center}</style></head><body><header><h1>STELLA · Koumassi V2.1</h1><small>Contours d’origine verrouillés · GPS + lots</small></header><section class="p"><div class="r"><input id="tour" placeholder="Tournée (099)" inputmode="numeric"><button onclick="findTour()">Voir</button><button class="a" onclick="resetMap()">Tout afficher</button><button class="a" onclick="gps()">📍 Ma position GPS</button></div><div class="r"><input id="q" value="Koumassi" placeholder="Quartier"><input id="i" placeholder="Îlot"><input id="l" placeholder="Lot"></div><div class="r"><button onclick="findLot()">Rechercher lot</button><button class="a" onclick="arm()">Placer le lot sur carte</button></div><div class="r"><input id="d" placeholder="Diamètre (mm)"><input id="lg" placeholder="Longueur (m)"><button onclick="arrived()">OK · Sur place</button></div><a id="route" class="b" target="_blank">Ouvrir l’itinéraire</a></section><div id="map"></div><section class="p"><b>Mes lots enregistrés</b><div class="r"><select id="saved"><option value="">Choisir un lot enregistré</option></select><button onclick="openLot()">Afficher le lot</button></div></section><div id="st" class="s">Chargement des 146 contours…</div><div class="f">V2.1 : les limites utilisent exactement les coordonnées du fichier de référence. Le GPS, la recherche et les lots déplacent seulement la vue. <button class="a" onclick="exp()">Exporter mes lots</button> <button class="a" onclick="imp.click()">Importer lots</button><input id="imp" type="file" accept=".json" hidden onchange="importLots(event)"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const $=x=>document.getElementById(x),st=t=>$('st').textContent=t;let map,all,baseBounds,by={},hi=null,armed=false,user=null,um=null,ac=null,lm=null,sel=null,lots={};
function n(v){v=String(v||'').trim();return /^\d+$/.test(v)?v.padStart(3,'0'):v}function c(v){v=String(v||'').trim().toLowerCase();return /^0*\d+$/.test(v)?String(Number(v)):v}function key(q,i,l){return[String(q||'').trim().toLowerCase(),c(i),c(l)].join('|')}
async function init(){try{let t=await fetch('./index.html?data=1',{cache:'no-store'}).then(r=>r.text()),m=t.match(/const data=(\{.*?\});(?:const \$|const map)/s);if(!m)throw Error('données introuvables');let data=JSON.parse(m[1]);map=L.map('map');L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap'}).addTo(map);all=L.geoJSON(data,{style:()=>({color:'#0877ad',weight:1.7,fillColor:'#36a2cf',fillOpacity:.20}),onEachFeature:(f,l)=>{let x=String(f.properties?.tournee||'').trim();(by[x]??=[]).push(l);l.bindPopup('Tournée '+x)}}).addTo(map);let b=all.getBounds();baseBounds=L.latLngBounds(b.getSouthWest(),b.getNorthEast());map.fitBounds(baseBounds.pad(.07));loadLots();st('V2.1 prête · '+data.features.length+' contours chargés. Limites verrouillées.')}catch(e){st('Erreur de chargement : '+e.message)}}
function clear(){if(hi){map.removeLayer(hi);hi=null}}
function findTour(){let q=n($('tour').value);clear();let fs=[];for(let [k,ls] of Object.entries(by))if(k===q)for(let l of ls)fs.push(l.feature);if(!fs.length){st('Tournée '+q+' introuvable.');return}hi=L.geoJSON({type:'FeatureCollection',features:fs},{style:{color:'#e97708',weight:4,fillColor:'#ffb02e',fillOpacity:.5}}).addTo(map);map.fitBounds(hi.getBounds().pad(.25),{maxZoom:18});st('Tournée '+q+' : '+fs.length+' contour(s) exact(s).')}
function resetMap(){clear();map.fitBounds(baseBounds.pad(.07));st('Cadrage général d’origine restauré.')}
function gps(){if(!navigator.geolocation)return st('GPS indisponible.');st('Recherche GPS…');navigator.geolocation.getCurrentPosition(p=>{user={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy};if(um)map.removeLayer(um);if(ac)map.removeLayer(ac);um=L.marker([user.lat,user.lng]).addTo(map).bindPopup('Ma position GPS').openPopup();ac=L.circle([user.lat,user.lng],{radius:user.accuracy,weight:1,fillOpacity:.08}).addTo(map);map.setView([user.lat,user.lng],18);st('GPS obtenu · précision ~'+Math.round(user.accuracy)+' m. Contours inchangés.')},e=>st('GPS non obtenu : '+(e.message||'autorisation refusée')),{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
function loadLots(){for(let z of ['stella_lots_v21','stellaLots','stella_lots_v17'])try{let o=JSON.parse(localStorage.getItem(z)||'{}');for(let [k,v] of Object.entries(o)){if(!v||!isFinite(v.lat)||!isFinite(v.lng))continue;let p=k.split('|'),q=v.quartier??p[0]??'Koumassi',i=v.ilot??p[1]??'',l=v.lot??p[2]??'';lots[key(q,i,l)]={...v,quartier:q,ilot:i,lot:l,lat:+v.lat,lng:+v.lng,label:v.label||q+' · Îlot '+i+' · Lot '+l}}}catch(e){}save()}
function save(){localStorage.setItem('stella_lots_v21',JSON.stringify(lots));let s=$('saved'),old=s.value;s.innerHTML='<option value="">Choisir un lot enregistré</option>';for(let [k,v] of Object.entries(lots).sort((a,b)=>(a[1].label||'').localeCompare(b[1].label||''))){let o=document.createElement('option');o.value=k;o.textContent=v.label;s.appendChild(o)}if(lots[old])s.value=old}
function valid(){if(!$('q').value.trim()||!$('i').value.trim()||!$('l').value.trim()){st('Renseignez quartier, îlot et lot.');return false}return true}
function arm(){if(valid()){armed=true;st('Touchez la position exacte du lot sur la carte.')}}
function route(v){$('route').href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(v.lat+','+v.lng);$('route').style.display='block'}
function dist(a,b){let R=6371000,r=x=>x*Math.PI/180,d1=r(b.lat-a.lat),d2=r(b.lng-a.lng),x=Math.sin(d1/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function show(v){sel=v;if(lm)map.removeLayer(lm);lm=L.marker([v.lat,v.lng]).addTo(map).bindPopup(v.label).openPopup();map.setView([v.lat,v.lng],19);route(v);st(v.label+' affiché.'+(user?' Distance GPS : '+Math.round(dist(user,v))+' m.':''))}
function findLot(){if(!valid())return;let v=lots[key($('q').value,$('i').value,$('l').value)];v?show(v):st('Lot non enregistré. Utilisez « Placer le lot sur carte ».')}
function openLot(){let v=lots[$('saved').value];if(v)show(v)}
function arrived(){if(!sel)return st('Sélectionnez d’abord un lot.');sel.diam=$('d').value.trim();sel.longueur=$('lg').value.trim();sel.arrived=new Date().toISOString();lots[key(sel.quartier,sel.ilot,sel.lot)]=sel;save();st('Validation enregistrée pour '+sel.label)}
function exp(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(lots,null,2)],{type:'application/json'}));a.download='STELLA_lots_Koumassi_V2_1.json';a.click()}
function importLots(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result),k=0;for(let [x,v] of Object.entries(o)){if(!v||!isFinite(v.lat)||!isFinite(v.lng))continue;let p=x.split('|'),q=v.quartier??p[0]??'Koumassi',i=v.ilot??p[1]??'',l=v.lot??p[2]??'';lots[key(q,i,l)]={...v,quartier:q,ilot:i,lot:l,lat:+v.lat,lng:+v.lng,label:v.label||q+' · Îlot '+i+' · Lot '+l};k++}save();st(k+' lot(s) importé(s).')}catch(e){st('Fichier invalide.')}};r.readAsText(f)}
init().then(()=>map.on('click',e=>{if(!armed)return;armed=false;let q=$('q').value.trim(),i=$('i').value.trim(),l=$('l').value.trim(),v={lat:e.latlng.lat,lng:e.latlng.lng,quartier:q,ilot:i,lot:l,label:q+' · Îlot '+i+' · Lot '+l};lots[key(q,i,l)]=v;save();show(v);st('Lot enregistré. Les limites des tournées n’ont pas été modifiées.')}));
</script></body></html>

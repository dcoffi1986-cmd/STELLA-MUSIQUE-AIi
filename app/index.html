<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STELLA MUSIC AI</title><style>
body{font:16px system-ui,sans-serif;background:#f3f7f5;color:#16372d;margin:0}header{background:#146451;color:white;text-align:center;padding:18px}main{max-width:600px;margin:18px auto;padding:12px}.panel{background:white;border-radius:18px;padding:22px;box-shadow:0 2px 12px #0001}button{border:0;border-radius:12px;background:#146451;color:white;padding:14px;font-size:16px;cursor:pointer}button:disabled{background:#b3bdb7;cursor:not-allowed}input{max-width:100%}.voices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.voices button{min-height:66px}.preview{width:100%;height:auto;border:1px solid #ddd;border-radius:9px;margin-top:8px}.muted{color:#5f7069;font-size:14px}.stop{background:#7e3b3b}#result{margin-top:18px}
</style></head><body><header><h1>♫ STELLA MUSIC AI</h1><div>Mon répétiteur de chorale</div></header><main><div class="panel"><h2>Ma partition</h2><form id="form"><input id="file" type="file" accept=".pdf,.xml,.musicxml,.mxl" required><p><button type="submit">Importer ma partition</button></p></form><p id="status" role="status" aria-live="polite"></p><section id="player" hidden><h2>Écouter une voix</h2><div class="voices" id="voices"></div><button class="stop" id="stop" type="button">■ Arrêter</button><p class="muted" id="voicehelp">Écoute expérimentale sur « ah » à partir d'un MusicXML. Le chant des paroles n'est pas encore disponible.</p></section><div id="result"></div></div></main>
<script>
let ctx=null,playing=[],timeout=null;
const status=document.getElementById('status'),result=document.getElementById('result'),player=document.getElementById('player');
function stop(){if(timeout)clearTimeout(timeout);timeout=null;for(const n of playing){try{n.stop()}catch(e){}}playing=[];if(ctx){ctx.close();ctx=null}}
document.getElementById('stop').onclick=stop;
function play(parts,indices){stop();ctx=new (window.AudioContext||window.webkitAudioContext)();const start=ctx.currentTime+.12;let duration=0;
for(const idx of indices){const part=parts[idx];if(!part)continue;for(const e of part.events){if(!e.pitches||!e.pitches.length)continue;const t=start+e.offset*.48, len=Math.max(.08,e.duration*.46);duration=Math.max(duration,e.offset*.48+len);
for(const midi of e.pitches.slice(0,2)){const fundamental=440*Math.pow(2,(midi-69)/12);if(!Number.isFinite(fundamental)||fundamental<60||fundamental>1300)continue;
const osc=ctx.createOscillator(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();
osc.type='sawtooth';osc.frequency.setValueAtTime(fundamental,t);filter.type='lowpass';filter.frequency.value=950;filter.Q.value=.6;
gain.gain.setValueAtTime(.0001,t);gain.gain.linearRampToValueAtTime(.045/indices.length,t+.045);gain.gain.setValueAtTime(.045/indices.length,Math.max(t+.045,t+len-.08));gain.gain.linearRampToValueAtTime(.0001,t+len);
osc.connect(filter).connect(gain).connect(ctx.destination);osc.start(t);osc.stop(t+len+.02);playing.push(osc)}}}
status.textContent='Lecture de démonstration : son vocal synthétique sans paroles.';timeout=setTimeout(stop,Math.min(120000,(duration+1)*1000))}
function showVoices(parts){const wrap=document.getElementById('voices');wrap.replaceChildren();const names=['Soprano','Alto','Ténor','Basse'];for(let i=0;i<4;i++){const b=document.createElement('button');b.textContent='▶ '+names[i]+' · '+(parts[i]?.name||'non disponible');b.disabled=!parts[i];b.onclick=()=>play(parts,[i]);wrap.append(b)}
const all=document.createElement('button');all.textContent='▶ Les 4 voix ensemble';all.style.gridColumn='1 / -1';all.disabled=!parts.length;all.onclick=()=>play(parts,[0,1,2,3]);wrap.append(all);player.hidden=false;
document.getElementById('voicehelp').textContent='Démonstration sur son vocal synthétique, sans paroles. L’ordre des voix dépend du fichier MusicXML et doit être vérifié.'}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();stop();player.hidden=true;result.replaceChildren();const file=document.getElementById('file').files[0];if(!file)return;status.textContent='Analyse en cours. Cela peut prendre quelques minutes…';try{const form=new FormData();form.append('file',file);const res=await fetch('/api/analyze',{method:'POST',body:form});const data=await res.json();if(!res.ok)throw Error(data.detail||'Erreur');
if(data.format==='musicxml'){showVoices(data.parts);status.textContent=data.source_format==='pdf'?'Partition PDF transcrite. Vérifie les voix avant écoute.':'Partition MusicXML importée. Choisis une voix pour la démonstration.'}
else{status.textContent='PDF importé. La reconnaissance musicale complète et le chant ne sont pas encore disponibles.';const p=document.createElement('p');p.className='muted';p.textContent=data.page_count+' page(s) importée(s). Le PDF ne permet pas encore de chanter automatiquement.';result.append(p);for(const page of data.pages){const img=document.createElement('img');img.className='preview';img.alt='Page '+page.number;img.src=page.preview;result.append(img)}}}catch(err){status.textContent='La reconnaissance a été interrompue. Le moteur musical met trop de temps à répondre. Réessaie plus tard ou importe un fichier MusicXML.'}});
</script></body></html>

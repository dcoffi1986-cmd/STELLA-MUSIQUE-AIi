<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STELLA MUSIC AI</title>
<style>body{font-family:system-ui;background:#f3f7f5;margin:0;color:#17372d}header{background:#146451;color:white;padding:24px;text-align:center}main{max-width:640px;margin:25px auto;padding:18px}section{background:white;border-radius:18px;padding:24px;box-shadow:0 2px 12px #0001}button{background:#146451;color:white;border:0;padding:13px 20px;border-radius:12px;font-size:16px}input{max-width:100%}.muted{color:#65736b}.preview{width:100%;height:auto;border:1px solid #ddd;border-radius:8px;margin-top:8px}li{margin:8px 0}</style></head>
<body><header><h1>♫ STELLA MUSIC AI</h1><p>Importation de partitions — prototype</p></header>
<main><section><h2>Importer une partition</h2><p>Choisis un PDF ou un fichier MusicXML. Pour les PDF, nous préparons actuellement les pages ; la lecture automatique des notes et le chant SATB sont encore en développement.</p>
<form id="form"><input id="file" type="file" accept=".pdf,.xml,.musicxml,.mxl" required><p><button>Analyser</button></p></form><p id="status" role="status"></p><div id="result"></div></section></main>
<script>
document.getElementById('form').addEventListener('submit',async e=>{
e.preventDefault();const f=document.getElementById('file').files[0],s=document.getElementById('status'),out=document.getElementById('result');if(!f)return;s.textContent='Analyse en cours…';out.replaceChildren();
try{const data=new FormData();data.append('file',f);const r=await fetch('/api/analyze',{method:'POST',body:data});const x=await r.json();if(!r.ok)throw Error(x.detail||'Erreur');s.textContent=x.warning||'Analyse terminée';
if(x.format==='pdf'){const h=document.createElement('h3');h.textContent=x.page_count+' page(s) importée(s)';out.append(h);for(const p of x.pages){const t=document.createElement('p');t.textContent='Page '+p.number;const img=document.createElement('img');img.className='preview';img.alt='Aperçu de la page '+p.number;img.src=p.preview;out.append(t,img)}}
else{const h=document.createElement('h3');h.textContent='Parties reconnues :';out.append(h);const ul=document.createElement('ul');for(const p of x.parts){const li=document.createElement('li');li.textContent=p.name+' — '+p.events.length+' événements';ul.append(li)}out.append(ul)}}
catch(err){s.textContent=err.message}});
</script></body></html>

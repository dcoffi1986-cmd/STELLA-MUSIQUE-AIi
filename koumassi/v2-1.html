<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STELLA Koumassi V2.5.1</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font:15px Arial,sans-serif;background:#f2f6f9;color:#163047}header{background:#064f73;color:#fff;padding:14px 16px}h1{font-size:21px;margin:0 0 4px}.sub{font-size:13px;opacity:.9}.panel{background:#fff;padding:12px;display:grid;gap:9px}.row{display:flex;gap:8px;flex-wrap:wrap}input,select{min-width:0;flex:1 1 120px;padding:12px;border:1px solid #cbd7df;border-radius:8px;font-size:16px;background:#fff}button,.btn{border:0;border-radius:8px;padding:12px 15px;background:#0785b8;color:#fff;font-size:15px;font-weight:700;cursor:pointer}.alt{background:#4b6e7d}.route{display:none;text-align:center;text-decoration:none}.mapwrap{position:relative}#map{height:49dvh;min-height:330px;background:#dfe8ee}.status{padding:12px 14px;background:#e7f5fc;font-size:16px;line-height:1.5}.note{padding:10px 14px;background:#fff7e5;font-size:13px;line-height:1.45}.foot{padding:11px 14px;font-size:12px;color:#526877}.leaflet-popup-content{font-size:14px}.tag{display:inline-block;padding:3px 7px;border-radius:10px;background:#e9f5fb;font-size:12px}</style></head><body><header><h1>STELLA · Koumassi V2.5.1</h1><div class="sub">Base V1.7 directe · BIA SUD + Îlot + Lot · GPS</div></header><section class="panel"><div class="row"><input id="tour" placeholder="Tournée (099)" inputmode="numeric"><button id="btnTour">Voir</button><button id="btnAll" class="alt">Tout afficher</button><button id="btnGps" class="alt">📍 Ma position GPS</button></div><div class="row"><select id="quartier"><option value="03">BIA SUD · code 03</option></select><input id="ilot" placeholder="Îlot" inputmode="numeric"><input id="lot" placeholder="Lot" inputmode="numeric"></div><div class="row"><button id="btnLot">Rechercher lot</button><button id="btnPlace" class="alt">Placer le lot sur carte</button></div><div class="row"><input id="diam" placeholder="Diamètre (mm)" inputmode="decimal"><input id="long" placeholder="Longueur (m)" inputmode="decimal"><button id="btnArrive">OK · Sur place</button></div><a id="route" class="btn route" target="_blank" rel="noopener">Ouvrir l’itinéraire</a></section><div class="mapwrap"><div id="map"></div></div><section class="panel"><b>Mes lots enregistrés</b><div class="row"><select id="saved"><option value="">Choisir un lot enregistré</option></select><button id="btnSaved">Afficher le lot</button></div></section><div id="status" class="status">Chargement des données…</div><div class="note"><b>V2.5.1 :</b> les tournées sont chargées par la méthode de référence qui fonctionnait dans la V2.1. Les lots BIA SUD restent intégrés.</div><div class="foot"><button id="btnExport" class="alt">Exporter mes lots</button> <button id="btnImport" class="alt">Importer lots</button><input id="importFile" type="file" accept=".json,application/json" hidden></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="v23-p0.js"></script><script src="v23-p1.js"></script><script src="v23-p2.js"></script><script src="v23-p3.js"></script><script>const $=id=>document.getElementById(id);const st=t=>$('status').textContent=t;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function canon(v){v=String(v??'').trim();return /^\d+$/.test(v)?String(parseInt(v,10)):v.toUpperCase()}async function ungzip64(b64){const raw=atob(b64||'');const u=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)u[i]=raw.charCodeAt(i);const ds=new DecompressionStream('gzip');return JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(ds)).text())}async function loadTours(){const t=await fetch('./index.html?data=1&v=251',{cache:'no-store'}).then(r=>r.text());const m=t.match(/const data=(\{.*?\});(?:const \$|const map)/s);if(!m)throw Error('données des tournées introuvables');return JSON.parse(m[1])}let map,tourLayer,tourBounds,byNum={},lotsData=[],userMarker,accuracyCircle,userPos,lotLayer,lotMarker,arming=false,selectedLot=null;let savedLots={};try{savedLots=JSON.parse(localStorage.getItem('stella_v25_lots')||'{}')||{}}catch(e){}const baseStyle={color:'#0877ad',weight:1.8,fillColor:'#36a2cf',fillOpacity:.13};function ptInRing(lat,lng,ring){let inside=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];const hit=((yi>lat)!=(yj>lat))&&(lng<(xj-xi)*(lat-yi)/(yj-yi+1e-15)+xi);if(hit)inside=!inside}return inside}function pointInGeom(lat,lng,g){if(!g)return false;const polys=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];for(const p of polys){if(p[0]&&ptInRing(lat,lng,p[0]))return true}return false}function clearTours(){if(!tourLayer)return;tourLayer.eachLayer(l=>l.setStyle(baseStyle))}function clearLot(){if(lotLayer){map.removeLayer(lotLayer);lotLayer=null}if(lotMarker){map.removeLayer(lotMarker);lotMarker=null}}function fitAll(msg='Tous les contours V1.7 affichés.'){clearTours();clearLot();if(tourBounds)map.fitBounds(tourBounds.pad(.06));st(msg)}function highlightTour(n){n=String(n||'').trim().padStart(3,'0');clearTours();const ls=byNum[n]||[];if(!ls.length){st('Tournée introuvable : '+n);return false}ls.forEach(l=>l.setStyle({color:'#f07b00',weight:4,fillColor:'#ffb52e',fillOpacity:.38}));const fg=L.featureGroup(ls);map.fitBounds(fg.getBounds(),{padding:[35,35],maxZoom:18});ls[0].openPopup();st('Tournée '+n+' : '+ls.length+' contour(s) exact(s) de la V1.7.');return true}function routeTo(lat,lng){const a=$('route');a.href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(lat+','+lng);a.style.display='block'}function showLot(r){clearLot();lotLayer=L.layerGroup().addTo(map);if(r.poly){const p=L.polygon(r.poly,{color:'#ff8a00',weight:4,fillColor:'#ffc04a',fillOpacity:.30}).addTo(lotLayer);map.fitBounds(p.getBounds(),{padding:[45,45],maxZoom:20})}else map.setView([r.lat,r.lon],19);lotMarker=L.marker([r.lat,r.lon]).addTo(lotLayer).bindPopup('<b>'+esc(r.quartier||'BIA SUD')+'</b><br>Îlot '+esc(r.ilot)+' · Lot '+esc(r.lot)+(r.tournee?'<br>Tournée '+esc(r.tournee):'')).openPopup();selectedLot=r;if(r.tournee)$('tour').value=r.tournee;routeTo(r.lat,r.lon);let msg=(r.quartier||'BIA SUD')+' · Îlot '+r.ilot+' · Lot '+r.lot;if(r.tournee)msg+=' · tournée '+r.tournee;if(userPos){const R=6371000,rad=Math.PI/180;const dlat=(r.lat-userPos.lat)*rad,dlon=(r.lon-userPos.lng)*rad;const a=Math.sin(dlat/2)**2+Math.cos(userPos.lat*rad)*Math.cos(r.lat*rad)*Math.sin(dlon/2)**2;msg+=' · distance GPS ~'+Math.round(2*R*Math.asin(Math.sqrt(a)))+' m'}st(msg+'.')}function findLot(){const i=canon($('ilot').value),l=canon($('lot').value);if(!i||!l){st('Saisir l’îlot et le lot.');return}const ms=lotsData.filter(r=>String(r.code)==='03'&&canon(r.ilot)===i&&canon(r.lot)===l);if(ms.length===1){const r={...ms[0],quartier:'BIA SUD'};showLot(r);return}if(ms.length>1){clearLot();lotLayer=L.layerGroup().addTo(map);const pts=[];ms.forEach((r,k)=>{L.polygon(r.poly,{color:'#ff8a00',weight:4,fillOpacity:.24}).addTo(lotLayer).bindPopup('Candidat '+(k+1)+' · Îlot '+r.ilot+' · Lot '+r.lot+' · tournée '+r.tournee);pts.push(...r.poly)});map.fitBounds(pts,{padding:[40,40],maxZoom:19});st(ms.length+' emplacements portent ce numéro dans BIA SUD. Touchez le bon contour.');return}const key=['03',i,l].join('|'),r=savedLots[key];if(r){showLot(r);return}st('Lot/îlot non trouvé dans BIA SUD. Vérifiez les numéros.')}function gps(){if(!navigator.geolocation){st('GPS non disponible.');return}if(!window.isSecureContext){st('GPS bloqué : ouvrir l’application avec le lien HTTPS.');return}st('Recherche de votre position GPS…');navigator.geolocation.getCurrentPosition(p=>{userPos={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy};const ll=[userPos.lat,userPos.lng];if(userMarker)map.removeLayer(userMarker);if(accuracyCircle)map.removeLayer(accuracyCircle);userMarker=L.marker(ll).addTo(map).bindPopup('Ma position GPS').openPopup();accuracyCircle=L.circle(ll,{radius:userPos.accuracy,weight:1,fillOpacity:.08}).addTo(map);map.setView(ll,18);const found=[];for(const [n,ls] of Object.entries(byNum)){for(const lyr of ls){if(pointInGeom(userPos.lat,userPos.lng,lyr.feature.geometry)){found.push(n);break}}}if(found.length){$('tour').value=found[0];st('GPS obtenu · précision ~'+Math.round(userPos.accuracy)+' m · tournée détectée : '+found.join(', ')+'.')}else st('GPS obtenu · précision ~'+Math.round(userPos.accuracy)+' m · aucune tournée détectée à cette position.')},e=>st('GPS non obtenu : '+e.message),{enableHighAccuracy:true,timeout:15000,maximumAge:0})}function arm(){if(!$('ilot').value.trim()||!$('lot').value.trim()){st('Saisir d’abord l’îlot et le lot.');return}arming=true;st('Touchez maintenant la position exacte du lot sur la carte.')}function saveAt(lat,lng){const i=canon($('ilot').value),l=canon($('lot').value),tour=String($('tour').value||'').trim().padStart(3,'0');const key=['03',i,l].join('|');const r={quartier:'BIA SUD',code:'03',ilot:i,lot:l,lat,lng,tournee:tour&&tour!=='000'?tour:'',manual:true};savedLots[key]=r;localStorage.setItem('stella_v25_lots',JSON.stringify(savedLots));refreshSaved();showLot(r);st('Lot enregistré manuellement : BIA SUD · Îlot '+i+' · Lot '+l+'.')}function arrived(){if(!selectedLot&&!userPos){st('Recherchez un lot ou obtenez votre GPS avant de valider.');return}const d=$('diam').value.trim(),lg=$('long').value.trim();let m='Position terrain validée.';if(d)m+=' Diamètre '+d+' mm.';if(lg)m+=' Longueur '+lg+' m.';st(m)}function refreshSaved(){const s=$('saved'),v=s.value;s.innerHTML='<option value="">Choisir un lot enregistré</option>';Object.entries(savedLots).sort().forEach(([k,r])=>{const o=document.createElement('option');o.value=k;o.textContent=(r.quartier||'BIA SUD')+' · Îlot '+r.ilot+' · Lot '+r.lot;s.appendChild(o)});s.value=v}function exportLots(){const b=new Blob([JSON.stringify(savedLots,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='stella_koumassi_lots.json';a.click();URL.revokeObjectURL(u)}function importLots(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||Array.isArray(o)||typeof o!=='object')throw 0;savedLots={...savedLots,...o};localStorage.setItem('stella_v25_lots',JSON.stringify(savedLots));refreshSaved();st('Lots importés.')}catch(e){st('Fichier de lots invalide.')}};r.readAsText(f)}Promise.all([loadTours(),ungzip64(window.V23_B64)]).then(([tours,lots])=>{lotsData=lots;map=L.map('map');L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap'}).addTo(map);tourLayer=L.geoJSON(tours,{style:baseStyle,onEachFeature:(f,l)=>{const n=String(f.properties?.tournee??'').trim().padStart(3,'0');(byNum[n]??=[]).push(l);l.bindPopup('Tournée : '+esc(n))}}).addTo(map);tourBounds=tourLayer.getBounds();map.fitBounds(tourBounds.pad(.06));map.on('click',e=>{if(arming){arming=false;saveAt(e.latlng.lat,e.latlng.lng)}});refreshSaved();st('V2.5.1 prête · '+tours.features.length+' contours de référence · BIA SUD : '+lots.length+' lots intégrés.');$('btnTour').onclick=()=>highlightTour($('tour').value);$('btnAll').onclick=()=>fitAll();$('btnGps').onclick=gps;$('btnLot').onclick=findLot;$('btnPlace').onclick=arm;$('btnArrive').onclick=arrived;$('btnSaved').onclick=()=>{const k=$('saved').value;if(k&&savedLots[k])showLot(savedLots[k])};$('btnExport').onclick=exportLots;$('btnImport').onclick=()=>$('importFile').click();$('importFile').onchange=importLots}).catch(e=>{console.error(e);st('Erreur de chargement V2.5.1 : '+e.message)})</script></body></html>
